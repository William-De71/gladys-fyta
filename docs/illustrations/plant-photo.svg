  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="560" y="0" width="240" height="450" fill="#fbf8f2" opacity="0.6"/>
  <rect x="0" y="380" width="800" height="70" fill="#b89a74"/>
  <g transform="translate(400 270)">
