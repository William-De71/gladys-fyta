<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16402c"/>
      <stop offset="1" stop-color="#2b6e4b"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8693e"/>
      <stop offset="1" stop-color="#a24f2b"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cd37f"/>
      <stop offset="1" stop-color="#2f9a4d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#wall)"/>
  <!-- the window light -->
  <g transform="translate(690 82)">
    <circle r="34" fill="#ffd45c"/>
    <g stroke="#ffd45c" stroke-width="7" stroke-linecap="round">
      <line x1="0" y1="-48" x2="0" y2="-64"/><line x1="0" y1="48" x2="0" y2="64"/>
      <line x1="-48" y1="0" x2="-64" y2="0"/><line x1="48" y1="0" x2="64" y2="0"/>
      <line x1="34" y1="34" x2="45" y2="45"/><line x1="-34" y1="-34" x2="-45" y2="-45"/>
      <line x1="34" y1="-34" x2="45" y2="-45"/><line x1="-34" y1="34" x2="-45" y2="45"/>
    </g>
  </g>
  <!-- the table -->
  <rect x="0" y="478" width="800" height="56" fill="#3d2a1d"/>
  <rect x="0" y="470" width="800" height="12" fill="#5a3e2b"/>
  <!-- the plant -->
  <g transform="translate(440 310)">
    <path d="M0 100 C-10 60 -6 20 0 -40" stroke="#2f7d45" stroke-width="8" fill="none"/>
    <path d="M0 40 C-60 10 -120 30 -150 -10 C-90 -40 -30 -20 0 40 Z" fill="url(#leaf)"/>
    <path d="M0 10 C50 -30 120 -20 150 -70 C80 -90 20 -60 0 10 Z" fill="url(#leaf)"/>
    <path d="M0 -40 C-26 -76 -12 -110 16 -118 C34 -90 28 -66 0 -40 Z" fill="url(#leaf)"/>
    <path d="M0 80 C40 60 110 80 140 40 C90 20 30 30 0 80 Z" fill="url(#leaf)"/>
    <g stroke="#1f6b37" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M-10 32 C-50 12 -90 10 -130 -6"/>
      <path d="M8 4 C40 -24 90 -36 130 -64"/>
      <path d="M8 74 C40 60 80 56 120 44"/>
    </g>
  </g>
  <!-- the FYTA Beam: a stick in the soil, its round head -->
  <g transform="translate(500 350)">
    <rect x="-7" y="10" width="14" height="80" rx="7" fill="#eef3f0"/>
    <circle cx="0" cy="0" r="26" fill="#ffffff"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#3ec27a" stroke-width="5"/>
    <circle cx="0" cy="0" r="6" fill="#3ec27a"/>
  </g>
  <!-- the pot -->
  <g transform="translate(350 402)">
    <rect x="-10" y="0" width="200" height="26" rx="6" fill="#d97c4f"/>
    <path d="M0 26 H180 L164 84 H16 Z" fill="url(#pot)"/>
    <rect x="-6" y="-4" width="192" height="12" rx="6" fill="#4a3426"/>
  </g>
  <!-- the readings: a drop, a thermometer -->
  <g transform="translate(626 230)">
    <path d="M0 -26 C14 -6 22 6 22 18 C22 32 12 40 0 40 C-12 40 -22 32 -22 18 C-22 6 -14 -6 0 -26 Z" fill="#6cc4ff"/>
  </g>
  <g transform="translate(690 300)">
    <rect x="-7" y="-36" width="14" height="52" rx="7" fill="#eef3f0"/>
    <circle cx="0" cy="22" r="13" fill="#ff8a65"/>
    <rect x="-3" y="-20" width="6" height="40" fill="#ff8a65"/>
  </g>
  <g stroke="#7ee08a" stroke-width="5" fill="none" stroke-dasharray="12 9" stroke-linecap="round">
    <path d="M526 338 C570 300 590 270 606 258"/>
    <path d="M528 358 C600 360 650 340 676 318"/>
  </g>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#ffffff">
    <text x="40" y="96" font-size="66" font-weight="bold">FYTA</text>
    <text x="42" y="142" font-size="28">for Gladys Assistant</text>
    <text x="42" y="182" font-size="20" fill="#cdeedb">soil moisture · light · temperature · care alerts</text>
  </g>
</svg>
